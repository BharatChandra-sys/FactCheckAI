# render.yaml — FactCheckAI deployment
# GitHub Student Pack + Render free tier + Neon PostgreSQL
#
# SETUP ORDER:
#   1. Create Neon DB at neon.tech → copy DATABASE_URL
#   2. Connect repo to Render → New → Blueprint → render.yaml
#   3. Set env vars in Render dashboard (marked sync: false)
#   4. Deploy

services:
  - type: web
    name: factcheckai-backend
    runtime: python
    region: oregon
    plan: free              # 512MB RAM, sleeps after 15min — UptimeRobot prevents this
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 75
    healthCheckPath: /health

    envVars:
      # ── Security ──────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true           # Render auto-generates secure random value

      # ── Database — Neon PostgreSQL (free tier) ────────────────
      # Get from: neon.tech → your project → Connection string
      # Format: postgresql://user:password@ep-xxx.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false

      # ── AI API Keys ───────────────────────────────────────────
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

      # ── Optional keys — leave blank to disable those features ─
      - key: SERPAPI_KEY
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: HF_TOKEN
        sync: false

      # ── App flags ─────────────────────────────────────────────
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DOCS
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: SKIP_TRAIN_ON_STARTUP
        value: "true"
      - key: WIKIDATA_ENABLED
        value: "false"
      - key: SOCIAL_GRAPH_ENABLED
        value: "false"
      - key: REDIS_ENABLED
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
