services:
  - type: web
    name: factcheckai-gemini-proxy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python gemini_web2api.py
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SKIP_BL_FETCH_ON_STARTUP
        value: "true"
