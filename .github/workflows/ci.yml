name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.9'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      working-directory: backend
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio httpx
    
    - name: Run tests
      working-directory: backend
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        JWT_SECRET: test-secret-key-for-ci-cd-pipeline
        SKIP_TRAIN_ON_STARTUP: "true"
        REDIS_ENABLED: "false"
        ENVIRONMENT: test
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing || echo "⚠️ Tests failed - check logs"
      continue-on-error: true
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./backend/coverage.xml
        flags: backend
        fail_ci_if_error: false

  lint-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.9'
        
    - name: Install linting tools
      run: |
        pip install flake8 black isort
        
    - name: Run flake8
      working-directory: backend
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting issues found"
      continue-on-error: true

  test-extension:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Check if package.json exists
      id: check_package
      working-directory: extension
      run: |
        if [ -f package.json ]; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Install dependencies
      if: steps.check_package.outputs.exists == 'true'
      working-directory: extension
      run: npm ci || npm install
        
    - name: Run extension tests
      if: steps.check_package.outputs.exists == 'true'
      working-directory: extension
      run: npm test || echo "⚠️ Extension tests not configured"
      continue-on-error: true
        
    - name: Lint extension code
      if: steps.check_package.outputs.exists == 'true'
      working-directory: extension
      run: npm run lint || echo "⚠️ Linting not configured"
      continue-on-error: true
    
    - name: Skip extension tests
      if: steps.check_package.outputs.exists == 'false'
      run: echo "ℹ️ No package.json found - skipping extension tests"

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.9'
        
    - name: Install security tools
      run: pip install bandit safety
        
    - name: Run Bandit security scan
      working-directory: backend
      run: |
        bandit -r app/ -f json -o bandit-report.json -ll || echo "⚠️ Security issues found"
      continue-on-error: true
        
    - name: Check dependencies for vulnerabilities
      working-directory: backend
      run: |
        safety check --json --output safety-report.json || echo "⚠️ Vulnerable dependencies found"
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          backend/bandit-report.json
          backend/safety-report.json

  build-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11.9'
        
    - name: Test build process
      working-directory: backend
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ Build simulation successful"